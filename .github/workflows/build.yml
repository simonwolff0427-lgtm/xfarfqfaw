name: Build SimpleAntiCheat from zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -o *.zip

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: simpleanticheat-plugin
        run: mvn -B clean package

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleAntiCheat-jar
          path: simpleanticheat-plugin/target/SimpleAntiCheat-*.jar
          if-no-files-found: error
